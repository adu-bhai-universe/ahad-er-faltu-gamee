<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bondhu Kando! 🎡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>🎡 Bondhu Kando!</h1>
  <p class="sub">Bondhu-der niye party game. Ekshathe boshe khelo! 😂</p>
  <div class="tabs">
    <button class="tab on" data-m="wheel">🎡 Dare Wheel</button>
    <button class="tab" data-m="who">🤔 Ke Korbe?</button>
  </div>

  <section id="wheel">
    <div class="wheelbox"><div class="pointer">🔻</div><canvas id="cv" width="340" height="340"></canvas></div>
    <button id="spin">🎡 Ghurao!</button>
  </section>

  <section id="who" hidden>
    <div class="q" id="q">Prosno-ta dekhte button chapo 👇</div>
    <div class="slot" id="slot">❓</div>
    <button id="ask">🎲 Notun Prosno + Uttor</button>
  </section>

  <div id="res" class="res">Shuru koro, dekhi kar bhaggo kharap 😈</div>
  <div class="chips" id="chips"></div>
</div>
<script src="script.js"></script>
</body>
</html>
